# fly.toml app configuration file generated for mybot24hr-v2 on 2026-10-17T16:28:30Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mybot24hr-v2'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
